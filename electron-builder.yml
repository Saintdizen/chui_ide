# Сборка дистрибутивов: electron-builder.
#
# Один и тот же файл описывает все три платформы — Windows (NSIS), Linux
# (AppImage + deb) и macOS (dmg), — потому что различия здесь только в целях
# и значке. Значки лежат в `build/`: из одного `icon.png` 512×512 сборщик
# делает `.ico` и `.icns` сам (см. `scripts/make-icon.mjs`).
appId: io.chui.ide
productName: chui_iDE
copyright: chui_iDE

directories:
  output: release
  buildResources: build

# В пакет идёт только собранный код: исходники TypeScript и моки проверок
# в дистрибутиве не нужны. `dist` — сама IDE, `node_modules` — то, что она
# запускает как отдельные процессы (языковые серверы; см. ниже).
files:
  - dist/**
  - package.json
  - node_modules/**
  - '!**/*.map'
  - '!**/*.ts'

# Из asar нельзя ни загрузить нативный модуль, ни ЗАПУСТИТЬ процесс: путь внутри
# архива не понимает чужая программа. Поэтому распаковываем всё, что запускается:
# node-pty (нативный модуль) и наши языковые серверы. Распаковываем `node_modules`
# целиком, а не список пакетов: серверу нужны и его зависимости (у
# typescript-language-server это `typescript-language-server/lib/*` и
# пакеты языковых серверов), и перечислять их поимённо — значит чинить упаковку при
# каждом обновлении пакета.
asarUnpack:
  - '**/*.node'
  - node_modules/**

# node-pty собирается под Electron, поэтому перед упаковкой пересобираем модули.
npmRebuild: true

artifactName: '${productName}-${version}-${os}-${arch}.${ext}'

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  # Не «одним кликом»: пользователь сам выбирает каталог установки.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: chui_iDE

linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Development
  # Имя .desktop-файла должно совпадать с именем, которое Electron сообщает
  # композитору: иначе среда не связывает окно с ярлыком (нет иконки в доке).
  syncDesktopName: true
  # deb требует сопровождающего: без него fpm отказывается собирать пакет.
  # Адрес — служебный (noreply GitHub): подпись пакета — дело самого проекта.
  maintainer: chui_iDE <chui-ide@users.noreply.github.com>
  synopsis: IDE с ассистентом
  description: >-
    chui_iDE — редактор кода на Electron: дерево проекта, свой редактор, терминал,
    git, ассистент с инструментами агента.
  desktop:
    entry:
      Name: chui_iDE
      Comment: Редактор кода с ассистентом
      Categories: Development;IDE;

deb:
  # Зависимости, без которых Electron не стартует на чистой системе.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

mac:
  # Обе архитектуры сразу: мака проверяющего мы не видим и какая у него платформа —
  # не знаем. Файлы различаются суффиксом `arm64`/`x64` в имени (`artifactName`).
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: build/icon.png
  category: public.app-category.developer-tools
  # ── подпись ────────────────────────────────────────────────────────────────
  # Было `identity: null` — «пропустить подпись целиком». На Intel такой файл ещё
  # запускался, а на Apple Silicon нет: ядро не принимает неподписанный код, и
  # система говорит «файл повреждён, переместите в Корзину». Это не карантин и не
  # «неизвестный разработчик» — файл действительно считается битым.
  #
  # `'-'` — ad-hoc подпись: сертификата Apple нет, но подпись есть, и приложение
  # запускается. Разрешение спрашивается обычным порядком (Открыть правым кликом),
  # а не отказом.
  identity: '-'
  hardenedRuntime: true
  # Права нужны: без них ad-hoc вместе с hardened runtime не запускают Electron на
  # arm64 (V8 собирает код на ходу, а нативные модули подписаны не нами).
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Оценку Gatekeeper при сборке не делаем: с ad-hoc она всегда «rejected», и
  # сборщик падал бы на ней. Подпись проверяется явно — см. шаг в release.yml.
  gatekeeperAssess: false

dmg:
  title: chui_iDE
