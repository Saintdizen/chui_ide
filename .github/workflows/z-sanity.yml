# Санити-проверка раннера: падают ли задания на GitHub вообще. Одна строка `echo`
# и имя машины в журнале отвечают сразу: получило ли задание раннер.
#
# Временный файл: удалить, когда причина отказов выяснится.
name: Санити
on: push

permissions:
  contents: read

jobs:
  probe:
    name: Санити — ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Кто я
        run: echo "раннер: $RUNNER_OS / $RUNNER_ARCH, хост: $(hostname)"

  probe-macos:
    name: Санити — macOS
    runs-on: macos-latest
    steps:
      - name: Кто я
        run: echo "раннер: $RUNNER_OS / $RUNNER_ARCH, хост: $(hostname)"
