name: Сборка дистрибутивов

# Код и сборка — здесь, в закрытом репозитории. Готовые файлы уезжают в открытый
# `Saintdizen/chui_ide_site`: там релиз виден всем, браузер скачивает файл по прямой
# ссылке без токена, и ссылка с сайта больше не упирается в 404 закрытого релиза.
#
# Отсюда две вещи, без которых ничего не выйдет:
#   * `GITHUB_TOKEN` в чужой репозиторий не достаёт, даже если владелец общий.
#     Нужен personal access token на запись в `chui_ide_site` (Contents: Read and
#     write), положенный в секреты этого репозитория под именем `SITE_TOKEN`.
#   * ноты релиза генерируются по истории коммитов, а в публичном репозитории
#     коммитов приложения нет. Поэтому `prepare` просит ноты у здешнего
#     репозитория (generate-notes) и передаёт готовый текст в публичный черновик.

env:
  # Куда публикуем релиз. Одно место, чтобы не искать строку по всему файлу.
  RELEASE_REPO: Saintdizen/chui_ide_site

# Собираем по тегу (`v1.2.3`) и вручную из интерфейса GitHub. На каждый push
# полная сборка трёх платформ не нужна: она занимает десятки минут, а проверить
# код на каждом изменении и так успевают обычные проверки (typecheck, smoke).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Черновик релиза готовится ОДИН раз, до сборки: три платформы льют файлы в один
  # и тот же релиз, и создавать его параллельно им нельзя — они гонялись бы за ним.
  #
  # Заодно убираем прежний черновик по тегу: повторный запуск раньше падал на
  # «update-a-release-asset → Not Found», потому что прежняя попытка оставляла
  # файл в состоянии «starter» (оборванная загрузка), а такой не перезаписать.
  # Тег не трогаем — так повторный запуск переживаем.
  prepare:
    name: Подготовить черновик релиза
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Здешний токен только читает: его дела хватает на generate-notes выше.
      # Запись нужна в ПУБЛИЧНОМ репозитории — её даёт SITE_TOKEN ниже.
      contents: read
    steps:
      # Ноты генерируются по ЗДЕШНЕЙ истории: в публичном репозитории коммитов
      # приложения нет, и `--generate-notes` там выдал бы пустой список изменений.
      # Токен тут свой — здешний: SITE_TOKEN в приватный репозиторий не достаёт.
      - name: Собрать описание изменений
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Без нот gh release create вообще откажется создавать релиз, а падать
          # из-за косметики перед самой сборкой незачем: не вышло собрать описание —
          # останется одна строка с тегом.
          notes=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" --jq .body) || notes=""
          [ -n "$notes" ] || notes="Сборка ${{ github.ref_name }}."
          printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"

      - name: Убрать прошлый черновик и создать новый
        env:
          # Токен на запись в ПУБЛИЧНЫЙ репозиторий, здесь его и меняем.
          GH_TOKEN: ${{ secrets.SITE_TOKEN }}
        # `--repo` обязателен: в этой задаче нет checkout, и без него gh не
        # понимает, о каком репозитории речь («fatal: not a git repository»), —
        # а с `|| true` это проходило молча, и черновик не готовился вовсе.
        # `--cleanup-tag` не ставим: тег трогать нельзя, по нему идёт сборка.
        #
        # Тег в публичном репозитории создаётся заново — на его дефолтной ветке:
        # коммита с этим хешем там нет, а нужен он только как якорь релиза.
        run: |
          gh release delete "${{ github.ref_name }}" --yes --repo "$RELEASE_REPO" || true
          gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" \
            --notes-file "$RUNNER_TEMP/notes.md" --repo "$RELEASE_REPO"

  build:
    name: ${{ matrix.label }}
    # Черновик есть — можно лить файлы. При ручном запуске `prepare` пропускается
    # (публиковать некуда), но саму сборку это останавливать не должно.
    needs: prepare
    if: always()
    runs-on: ${{ matrix.os }}
    permissions:
      # Запись не нужна: файлы льются в публичный репозиторий, права на него
      # несёт SITE_TOKEN (у GITHUB_TOKEN доступа туда нет).
      contents: read
    strategy:
      # Платформы независимы: упавшая сборка deb не должна отменять dmg.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (AppImage, deb)
            target: --linux AppImage deb
          - os: windows-latest
            label: Windows (NSIS)
            target: --win nsis
          - os: macos-latest
            label: macOS (dmg, zip)
            # dmg и zip, обе архитектуры (arch — из electron-builder.yml). zip нужен
            # не «на всякий случай»: если dmg не монтируется, человек скачивает архив.
            target: --mac dmg zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить код (типы, линт, тесты)
        run: npm run check

      - name: Собрать main и renderer
        run: npm run build

      # node-pty — нативный модуль, и он должен быть собран ПОД Electron той же
      # версии, что в devDependencies: иначе приложение падает при открытии
      # терминала с «Failed to load native module: pty.node».
      - name: Пересобрать нативный модуль под Electron
        run: npx electron-rebuild -f -w node-pty

      - name: Упаковать
        # --publish never: публикацию делает шаг ниже, одним местом.
        run: npx electron-builder ${{ matrix.target }} --publish never

      # Проверка mac-сборки ДО того, как файл попадёт в релиз. Без неё неподписанный
      # dmg уезжал к человеку, и тот видел «файл повреждён»: на Apple Silicon система
      # не запускает неподписанный код. Здесь это ловит маковый раннер — тот же, что
      # собрал, — и валит сборку, а не выпуск.
      - name: Проверить mac-сборку (подпись, архитектура, запуск)
        if: runner.os == 'macOS'
        run: bash scripts/mac-sign-check.sh release

      # Файлы идут в релиз прямо отсюда, без промежуточного хранилища артефактов:
      # прогон через `upload-artifact`/`download-artifact` стоил ~540 МБ на релиз
      # (AppImage+deb+exe+dmg) и упирался в квоту — «Failed to CreateArtifact:
      # Artifact storage quota has been hit», после чего релиз не выходил вовсе.
      # Здесь каждый собирает своё и сразу прикладывает к общему черновику.
      - name: Приложить файлы к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Релиз в ДРУГОМ репозитории: сборка здесь, публикация — в открытом
          # `chui_ide_site`. Поэтому и адрес, и токен задаются явно.
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.SITE_TOKEN }}
          draft: true
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.yml
