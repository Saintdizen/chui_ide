name: Сборка дистрибутивов

# Собираем по тегу (`v1.2.3`) и вручную из интерфейса GitHub. На каждый push
# полная сборка трёх платформ не нужна: она занимает десятки минут, а проверить
# код на каждом изменении и так успевают обычные проверки (typecheck, smoke).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Платформы независимы: упавшая сборка deb не должна отменять dmg.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (AppImage, deb)
            target: --linux AppImage deb
            artifact: linux
          - os: windows-latest
            label: Windows (NSIS)
            target: --win nsis
            artifact: windows
          - os: macos-latest
            label: macOS (dmg)
            target: --mac dmg
            artifact: macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить код (типы, линт, тесты)
        run: npm run check

      - name: Собрать main и renderer
        run: npm run build

      # node-pty — нативный модуль, и он должен быть собран ПОД Electron той же
      # версии, что в devDependencies: иначе приложение падает при открытии
      # терминала с «Failed to load native module: pty.node».
      - name: Пересобрать нативный модуль под Electron
        run: npx electron-rebuild -f -w node-pty

      - name: Упаковать
        # --publish never: публикацию делает отдельная задача ниже, одним местом.
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Загрузить артефакты
        uses: actions/upload-artifact@v4
        with:
          name: chui-ide-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.yml

  release:
    name: Опубликовать релиз
    # Релиз собирается только по тегу: из ручного запуска публиковать нечего.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Скачать артефакты
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Приложить файлы к релизу
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
          generate_release_notes: true
