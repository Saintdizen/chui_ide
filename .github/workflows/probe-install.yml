name: Проба установки

# Временный workflow — только для замера `npm ci`. Основной ci.yml не трогаем: замер —
# не проверка. Файл удалить, как только цифры окажутся в TASKS.md.
#
# Зачем: установка занимает 21–23с в каждом из трёх заданий, и кеш node_modules это не
# лечит (проверено 24.10). Вопрос пробы: из этих секунд сколько распаковка, сколько
# скачивание, сколько установочные скрипты — и сколько стоит выкинуть электрон.
#
# Каждая ступень — отдельный шаг на ОДНОЙ машине в ОДНОМ задании: время между шагами
# сравнимо, между заданиями — нет (разные раннеры).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-ci:
    name: Установка, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: '1. npm ci (как есть)'
        run: npm ci

      # Ступени 2–4 идут на стёртом дереве: иначе npm ci на готовом дереве
      # отработает втрое быстрее и замер соврёт в меньшую.
      - name: 'Стереть node_modules'
        shell: bash
        run: rm -rf node_modules

      # 2. Без сети: кеш ~/.npm уже набит. Разница с (1) = стоимость сети.
      - name: '2. npm ci --offline'
        run: npm ci --offline

      - name: 'Стереть node_modules'
        shell: bash
        run: rm -rf node_modules

      # 3. Без установочных скриптов: разница с (2) = стоимость скриптов (electron,
      # сборка node-pty). Вариант НЕ рабочий — он только мера.
      - name: '3. npm ci --ignore-scripts --offline'
        run: npm ci --ignore-scripts --offline

      - name: 'Стереть node_modules'
        shell: bash
        run: rm -rf node_modules

      # 4. Главный вопрос: нужен ли в CI сам electron? Он тянет бинарник ~100МБ
      # постскриптом, а ни одна проверка его не запускает: типы, линт, тесты и сборка
      # (tsc + vite) — чистый Node. Если (4) близко к (1) — вот и настоящий выигрыш.
      - name: '4. npm ci --omit=dev (без электрона)'
        run: npm ci --omit=dev

      # Что осталось: в (4) electron быть не должно — это и есть его смысл.
      - name: 'Итог: дерево после --omit=dev'
        shell: bash
        run: |
          test -d node_modules/electron && echo 'electron: ДА' || echo 'electron: НЕТ'
          test -d node_modules/vitest && echo 'vitest: ДА' || echo 'vitest: НЕТ'
          du -sh node_modules
