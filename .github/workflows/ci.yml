name: Проверки

# Постоянные проверки на каждый push и pull request. Сборку дистрибутивов
# здесь не делаем: она долгая и нужна только к релизу (см. release.yml).
on:
  push:
    # Любая ветка, не только main: проверку хочется запускать и с временной ветки,
    # не вливая правку в main ради ответа «зелено или нет».
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Типы, линт, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # check = typecheck + формат + lint + test. Одна команда — чтобы локально и в CI
      # проверялось ровно одно и то же.
      - name: Проверить код
        run: npm run check

      # Покрытие чистой логики — порог в vitest.config.mts. Отдельным шагом, а не
      # в `check`: покрытие нужно раз на прогон, а не при каждой правке.
      - name: Покрытие
        run: npm run test:coverage

      - name: Собрать main и renderer
        run: npm run build

      # Проверка правок с не-ASCII: чистый Node, без Electron и дисплея.
      - name: Smoke — правки текста
        run: npm run smoke:edits

  # Windows отличается от Linux настолько, что расхождение ловится только тут:
  # и разделители путей, и поведение нативного node-pty, и освобождение файлов
  # (EBUSY). Гоняем лишь проверки из `check` — сборка дистрибутивов долгая и
  # остаётся за release.yml.
  check-windows:
    name: Проверки на Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: ВРЕМЕННО — что видит Windows в каталоге заглушки
        run: node scripts/win-rg-probe.cjs

      - name: Проверить код
        run: npm run check

  # macOS тоже расходится с Linux в мелочах работы с путями и файлами: `os.tmpdir()`
  # возвращает `/var/folders/…` — симлинк на `/private/var/…`, а `git` и дочерние
  # процессы отвечают уже развёрнутым путём; файловая система по умолчанию не
  # различает регистр. Ни на Linux, ни на Windows это не видно, поэтому проверяем
  # отдельной задачей — теми же проверками из `check`.
  check-macos:
    name: Проверки на macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить код
        run: npm run check
