name: Проверки

# Постоянные проверки на каждый push и pull request. Сборку дистрибутивов
# здесь не делаем: она долгая и нужна только к релизу (см. release.yml).
on:
  push:
    # Любая ветка, не только main: проверку хочется запускать и с временной ветки,
    # не вливая правку в main ради ответа «зелено или нет».
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Типы, линт, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Кеш здесь и ниже — для ~/.npm (тарболы пакетов), а не для node_modules:
      # `setup-node` с `cache: npm` держит только его. Полная установка Node ещё
      # ~14с, потом node_modules ~14с. Пробовать `actions/cache` на сам
      # node_modules стоит только пробой на ветке — нативный `node-pty` и
      # платформенные опциональные пакеты легко дают испорченный кеш.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      # Статик — первым отдельным шагом: красный тип или линт не должны тянуть за
      # собой тесты, а значит и минуту ожидания ответа.
      - name: Статическая проверка
        run: npm run check:static

      # Тесты вместе с порогами покрытия. Отдельного шага «Покрытие» нет: он
      # дублировал этот проход за те же цифры и ещё минуту.
      - name: Тесты
        run: npm run test:coverage

      - name: Собрать main и renderer
        run: npm run build

      # Проверка правок с не-ASCII: чистый Node, без Electron и дисплея.
      - name: Smoke — правки текста
        run: npm run smoke:edits

  # Windows отличается от Linux настолько, что расхождение ловится только тут:
  # и разделители путей, и поведение нативного node-pty, и освобождение файлов
  # (EBUSY). Сборка дистрибутивов долгая и остаётся за release.yml.
  #
  # Тесты здесь БЕЗ покрытия: тот же прогон идёт на Windows 104 с против 56 с на
  # Linux, и v8-инструментация добавляет половину этого времени. Пороги покрытия
  # — свойство кодобазы, а не платформы: их проверяет задача check.
  check-windows:
    name: Проверки на Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Статическая проверка
        run: npm run check:static

      - name: Тесты
        run: npm test

      # ВРЕМЕННО (ветка measure/windows-test-time): пофайловое время на Windows.
      # Удалить вместе с веткой — это замер, а не проверка.
      - name: Замер времени по файлам
        run: npx tsx scripts/test-time-census.ts --runs=3 --top=20

      # Цифры забираем артефактом: логи шага в API отдаются без токена-владельца.
      - name: Сохранить замер
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: time-windows
          path: time-windows.json
          if-no-files-found: warn

  # macOS тоже расходится с Linux в мелочах работы с путями и файлами: `os.tmpdir()`
  # возвращает `/var/folders/…` — симлинк на `/private/var/…`, а `git` и дочерние
  # процессы отвечают уже развёрнутым путём; файловая система по умолчанию не
  # различает регистр. Ни на Linux, ни на Windows это не видно, поэтому проверяем
  # отдельной задачей. Тесты, как и на Windows, без покрытия: пороги уже проверены
  # в check, а сама инструментация v8 здесь стоит тех же секунд.
  check-macos:
    name: Проверки на macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Статическая проверка
        run: npm run check:static

      - name: Тесты
        run: npm test
